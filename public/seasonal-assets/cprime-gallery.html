<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C′案72候・季節のきざし</title><style>
:root{background:#f7f2e8;color:#463f33;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0}main{max-width:1440px;margin:auto;padding:42px 32px}a{color:#526a52;text-underline-offset:4px}h1{font-family:serif;font-weight:500;font-size:36px;margin:20px 0 12px}p{line-height:1.8;font-size:14px;color:#77705f}.tools{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0}button,input{font:inherit}button{cursor:pointer;border:1px solid #d8d1c0;padding:8px 14px;border-radius:24px;background:transparent;color:inherit}button[aria-pressed=true]{background:#526a52;color:#fff}input{max-width:100%;padding:10px;border:1px solid #d8d1c0;border-radius:6px;background:#fbf8f2}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 18px}.card{min-width:0}.art{display:flex;width:100%;padding:0;border-radius:10px;background:#fbf8f2;overflow:hidden;border:1px solid #dfd7c7}.frame{min-width:0;flex:1;position:relative}.frame img{width:100%;display:block;aspect-ratio:1;object-fit:contain}.label{display:block;font-size:11px;text-align:center;padding-bottom:10px;color:#77705f}h2{font-family:serif;font-weight:500;font-size:18px;margin:12px 0 4px}.meta{font-size:11px;color:#77705f}.target{font-size:12px;margin:6px 0}dialog{max-width:960px;width:calc(100% - 32px);max-height:calc(100dvh - 32px);overflow:auto;background:#f7f2e8;border:1px solid #dfd7c7;border-radius:12px;padding:20px;color:#463f33}dialog::backdrop{background:#29271f99}.dialog-head{display:flex;justify-content:space-between;gap:12px}.pair{display:flex}.pair .frame{width:50%}.close{border-radius:6px}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #879b79;outline-offset:3px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){main{padding:26px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}.tools{gap:10px}button{font-size:12px;padding:8px 10px}.pair{display:block}.pair .frame{width:100%}h1{font-size:30px}}
</style><main><nav><a href="c-gallery.html">C案の図案集</a> · <a href="cprime-fixed.html">C′案の固定配置</a></nav><h1>C′案72候</h1><p>季節が訪れる前の、小さなきざし。C案の差し色パーツだけを残しました。元の位置と大きさを保ち、候が訪れると同じ場所にC案の全体が現れます。</p><div class="tools" id="modes" aria-label="表示状態"></div><div class="tools" id="seasons" aria-label="季節で絞り込み"></div><input id="search" type="search" placeholder="候名・節気で検索" aria-label="候名・節気で検索"><p id="status" role="status">読み込んでいます。</p><section id="gallery" class="grid"></section></main><dialog id="detail"><div class="dialog-head"><h2 id="detail-title"></h2><button class="close">閉じる</button></div><div class="pair" id="pair"></div><p id="detail-target"></p></dialog><script>
const names={spring:'春',summer:'夏',autumn:'秋',winter:'冬'};let entries=[],season='all',mode='prime';const dialog=document.querySelector('#detail');
function frame(e,variant){const box=document.createElement('div');box.className='frame';const img=document.createElement('img');const prime=variant==='prime';img.src=(prime?'color-study-cprime72/':'color-study-c72/')+e.image+'?v='+(prime?e.generationHash:e.sourceSha256).slice(0,12);img.alt=e.name+' '+(prime?'C′':'C');img.loading='lazy';box.append(img);const label=document.createElement('span');label.className='label';label.textContent=prime?'訪れる前 C′':'訪れた状態 C';box.append(label);return box;}
function render(){const q=document.querySelector('#search').value.trim();const visible=entries.filter(e=>(season==='all'||season===e.season)&&(!q||[e.name,e.sekki,e.id].join(' ').includes(q)));document.querySelector('#status').textContent=`${visible.length}候を表示 / 全${entries.length}候`;document.querySelector('#gallery').replaceChildren(...visible.map(e=>{const card=document.createElement('article');card.className='card';card.dataset.kouId=e.id;const art=document.createElement('button');art.className='art';art.setAttribute('aria-label',e.name+'のC′とCを比較');for(const variant of mode==='compare'?['prime','full']:[mode])art.append(frame(e,variant));art.onclick=()=>{document.querySelector('#detail-title').textContent=e.name;document.querySelector('#pair').replaceChildren(frame(e,'prime'),frame(e,'full'));document.querySelector('#detail-target').textContent=e.targetLabel;dialog.showModal()};const meta=document.createElement('p');meta.className='meta';meta.textContent=names[e.season]+' / '+e.sekki+' / '+e.id;const title=document.createElement('h2');title.textContent=e.name;card.append(art,meta,title);return card}));}
for(const [value,label]of [['prime','訪れる前 C′'],['full','訪れた状態 C'],['compare','並べて比較']]){const b=document.createElement('button');b.textContent=label;b.dataset.mode=value;b.setAttribute('aria-pressed',value===mode);b.onclick=()=>{mode=value;document.querySelectorAll('#modes button').forEach(n=>n.setAttribute('aria-pressed',n===b));render()};document.querySelector('#modes').append(b)}
for(const [value,label]of [['all','すべて'],...Object.entries(names)]){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',value===season);b.onclick=()=>{season=value;document.querySelectorAll('#seasons button').forEach(n=>n.setAttribute('aria-pressed',n===b));render()};document.querySelector('#seasons').append(b)}
document.querySelector('#search').oninput=render;document.querySelector('.close').onclick=()=>dialog.close();fetch('color-study-cprime72/manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(m=>{if(m.entries.length!==72)throw Error();entries=m.entries;render()}).catch(()=>document.querySelector('#status').textContent='画像を読み込めませんでした。');
</script></html>
