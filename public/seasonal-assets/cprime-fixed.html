<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C′案72候・固定配置</title><style>
:root{color-scheme:light;background:#f7f2e8;color:#463f33;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:42px 28px 60px}h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;font-size:clamp(28px,5vw,40px);margin:12px 0 18px}a{color:#526a52;text-underline-offset:4px}nav{font-size:13px;line-height:1.9}.intro,#status{font-size:14px;line-height:1.9;color:#77705f}.legend{display:flex;gap:12px 22px;flex-wrap:wrap;font-size:12px;margin:24px 0}.legend span{display:flex;align-items:center;gap:7px}.legend i{display:inline-block;width:13px;height:13px;border-radius:50%}.canvas{width:100%;max-width:800px;margin:12px auto}svg{display:block;width:100%;height:auto}#status{margin:18px 0 0}@media(max-width:480px){main{padding:26px 16px 40px}}
button{font:inherit;border:1px solid #d8d1c0;padding:9px 16px;border-radius:24px;background:transparent;color:#463f33;cursor:pointer}button[aria-pressed=true]{background:#526a52;color:#fff}</style></head><body><main><nav><a href="cprime-growth.html">成長アニメーションの試作</a> · <a href="cprime-gallery.html">C′案の図案集</a> · <a href="revision-review.html#filled-preview">A案の固定配置</a></nav><h1>C′案72候の固定配置</h1><p class="intro">候が訪れる前の状態。C案の差し色パーツだけを、同じ位置・大きさで並べています。</p><div class="legend" aria-label="季節のアクセントカラー"><span><i style="background:#E73E73"></i>春・桃 #E73E73</span><span><i style="background:#F24B20"></i>夏・朱 #F24B20</span><span><i style="background:#F48708"></i>秋・橙 #F48708</span><span><i style="background:#155DD8"></i>冬・青 #155DD8</span></div><div class="tools"><button id="toggle" type="button" aria-pressed="false">訪れた状態 C を表示</button></div><div class="canvas"><svg id="fixed72" viewBox="0 0 700 700" role="img" aria-label="C′案72候の固定配置" data-ready="false"></svg></div><p id="status" role="status" aria-live="polite">C′案の配置を読み込んでいます。</p></main><script>
const svg=document.getElementById('fixed72'),status=document.getElementById('status');
let full=false,serial=0;document.querySelector('#toggle').onclick=()=>{full=!full;document.querySelector('#toggle').textContent=full?'訪れる前 C′ を表示':'訪れた状態 C を表示';document.querySelector('#toggle').setAttribute('aria-pressed',full);load()};
async function load(){const request=++serial,isFull=full,base=isFull?'color-study-c72/':'color-study-cprime72/';try{const response=await fetch(base+'layout.json',{cache:'no-store'});if(!response.ok)throw Error('pending');const layout=await response.json();if(!Array.isArray(layout.entries)||layout.entries.length!==72)throw Error('pending');const images={};await Promise.all(Object.entries(layout.sources).map(async([id,source])=>{const image=new Image();const url=new URL(source.path,new URL(base,location.href));if(source.sha256)url.searchParams.set('v',source.sha256.slice(0,12));image.src=url.href;await image.decode();images[id]=image;}));const fragment=document.createDocumentFragment();for(const entry of layout.entries){const source=layout.sources[entry.sourceId||entry.id];const image=images[entry.sourceId||entry.id];if(!source||!image)throw Error('pending');const scale=layout.commonVisibleLongEdge/source.visibleLongEdge;const node=document.createElementNS('http://www.w3.org/2000/svg','image');const attributes={href:image.src,x:entry.x-source.visibleCenter[0]*scale,y:entry.y-source.visibleCenter[1]*scale,width:source.canvas[0]*scale,height:source.canvas[1]*scale,'data-kou-id':entry.id,'data-season':entry.season,'data-center-x':entry.x,'data-center-y':entry.y,'data-visible-size':layout.commonVisibleLongEdge};for(const [key,value] of Object.entries(attributes))node.setAttribute(key,value);const title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=entry.name;node.append(title);fragment.append(node);}if(request!==serial)return;svg.replaceChildren(fragment);svg.dataset.ready='true';document.body.dataset.ready='true';svg.dataset.variant=isFull?'C':'C′';status.textContent=isFull?'訪れた状態 C を表示しています。':'訪れる前の状態 C′を表示しています。';}catch(error){if(request!==serial)return;status.textContent='C′案の画像を準備しています。15秒ごとに読み込み直します。';setTimeout(load,15000);}}load();
</script></body></html>
