<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>七十二候の図案集</title>
<style>
:root{color-scheme:light;--paper:#f7f2e8;--ink:#463f33;--muted:#77705f;--line:#dfd7c7;--green:#526a52;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}a{color:var(--green);text-underline-offset:4px}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #879b79;outline-offset:4px}main{max-width:1440px;margin:auto;padding:48px 40px 80px}.eyebrow{color:var(--green);font-size:12px;letter-spacing:.18em;margin:0 0 14px}h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;font-size:clamp(30px,4vw,46px);letter-spacing:.08em;margin:0 0 18px}.intro{max-width:670px;line-height:1.9;color:var(--muted);font-size:14px;margin:0}header{display:flex;align-items:flex-start;justify-content:space-between;gap:28px}header>a{font-size:13px;white-space:nowrap;margin-top:9px}.status-line{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:30px 0 20px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}#summary{color:var(--ink)}.tools{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 26px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{border:1px solid transparent;border-radius:30px;padding:8px 18px;background:transparent;color:var(--muted);font-size:14px}.filters button[aria-pressed="true"]{background:var(--green);color:var(--paper)}.search{display:block;position:relative}.search input{width:270px;max-width:100%;padding:10px 14px;background:#fbf8f1;border:1px solid var(--line);border-radius:6px;color:var(--ink);font-size:13px}#result-count{font-size:12px;color:var(--muted);margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 20px}.card{min-width:0}.art-button{position:relative;display:block;width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:#fbf8f2;overflow:hidden;padding:12px}.art-button img{display:block;width:100%;height:100%;object-fit:contain;transition:transform .25s ease}.art-button:hover img{transform:scale(1.035)}.empty-art{display:flex;height:100%;flex-direction:column;justify-content:center;align-items:center;gap:12px;color:#928a79;font-size:13px}.empty-art .number{font-family:serif;font-size:38px;color:#c8bfad;letter-spacing:.08em}.badge{position:absolute;left:12px;top:12px;padding:4px 8px;border-radius:4px;background:#eee7d9;color:#6e6654;font-size:10px}.badge.succeeded{background:#edf1e7;color:#526a52}.badge.failed{background:#f3e5dd;color:#925a41}.card-meta{padding:14px 2px}.card-top{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-bottom:7px}.card h2{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:19px;line-height:1.5;font-weight:500;margin:0 0 8px}.meaning,.color-reason{font-size:12px;line-height:1.8;margin:6px 0;color:var(--muted)}.color-reason{color:#696351}.swatches{display:flex;gap:5px;margin-top:10px}.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid #00000010}.notice{padding:36px 20px;text-align:center;line-height:1.8;color:var(--muted);border:1px solid var(--line);border-radius:10px}.error{color:#925a41}dialog{width:min(1040px,calc(100% - 32px));max-height:calc(100dvh - 32px);padding:0;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#29271f99;backdrop-filter:blur(3px)}.modal-top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}.modal-top span{font-size:12px;color:var(--muted)}.icon-button{border:0;background:transparent;color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:23px}.icon-button:hover{background:#e9e2d5}.detail{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}.detail-art{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#fbf8f2;padding:22px;min-width:0}.detail-art img{width:100%;height:100%;object-fit:contain}.detail-copy{padding:34px 28px;min-width:0;align-self:center}.detail-copy h2{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:29px;line-height:1.5;font-weight:500;margin:10px 0 18px}.detail-copy p{font-size:14px;line-height:1.9}.detail-copy .swatch{width:20px;height:20px}.palette-key{display:flex;gap:9px;align-items:center;margin:8px 0;font-size:12px;color:var(--muted)}.detail-copy .download{display:inline-block;margin-top:20px;font-size:13px}.modal-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:12px 20px}.nav-button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:5px;padding:9px 16px;font-size:13px}.nav-button:disabled{opacity:.35;cursor:default}#detail-position{font-size:12px;color:var(--muted)}@media(max-width:1000px){main{padding:36px 24px 60px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){main{padding:28px 16px 48px}header{display:block}header>a{display:inline-block;margin-top:18px}.tools{display:block}.search{margin-top:15px}.search input{width:100%}.filters{justify-content:space-between;gap:2px}.filters button{padding:8px 14px}.status-line{display:block;line-height:1.9;margin-top:24px}#batch-note{display:block}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}.card h2{font-size:17px}.art-button{padding:8px}.badge{left:8px;top:8px}.detail{display:block}.detail-art{max-height:48dvh;aspect-ratio:1}.detail-copy{padding:22px}.detail-copy h2{font-size:24px}.modal-top,.modal-bottom{padding:10px 14px}.meaning,.color-reason{font-size:11px}}@media(prefers-reduced-motion:reduce){.art-button img{transition:none}}
</style>
</head>
<body>
<main>
<header><div><p class="eyebrow">季節をかたちに</p><h1>七十二候の図案集</h1><p class="intro">風がほどく氷、ひらく花、色づく葉。候の意味を手がかりに、季節の一場面を色と輪郭で描きます。図案を選ぶと、大きく表示できます。</p></div><a href="revision-review.html#filled-preview">配置プレビューへ</a></header>
<div class="status-line" role="status" aria-live="polite"><span id="summary">図案一覧を読み込んでいます。</span><span id="batch-note"></span></div>
<div class="tools"><div class="filters" role="group" aria-label="季節で絞り込み"><button type="button" data-season="all" aria-pressed="true">すべて</button><button type="button" data-season="spring" aria-pressed="false">春</button><button type="button" data-season="summer" aria-pressed="false">夏</button><button type="button" data-season="autumn" aria-pressed="false">秋</button><button type="button" data-season="winter" aria-pressed="false">冬</button></div><label class="search"><input type="search" id="search" aria-label="候名・節気・番号で検索" placeholder="候名・節気・番号で検索" autocomplete="off"></label></div>
<p id="result-count"></p><div id="gallery" class="grid" aria-label="七十二候の画像案"></div><p id="notice" class="notice" hidden></p>
</main>
<dialog id="detail-dialog" aria-labelledby="detail-title"><div class="modal-top"><span id="detail-kicker"></span><button type="button" class="icon-button" id="close-dialog" aria-label="閉じる">×</button></div><div id="detail" class="detail"></div><div class="modal-bottom"><button type="button" class="nav-button" id="previous">← 前の候</button><span id="detail-position"></span><button type="button" class="nav-button" id="next">次の候 →</button></div></dialog>
<script>
const seasons={spring:'春',summer:'夏',autumn:'秋',winter:'冬'};
const statuses={pending:'生成待ち',succeeded:'生成済み',failed:'生成失敗'};
const state={entries:[],season:'all',query:'',selected:null,revision:'',timer:null};
const gallery=document.getElementById('gallery');
const dialog=document.getElementById('detail-dialog');
const notice=document.getElementById('notice');
function element(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
function assetUrl(path){if(!path)return null;const url=new URL(/^(?:https?:)?\/\//.test(path)||path.startsWith('/')?path:`poc-v3/${path}`,location.href);return ['http:','https:'].includes(url.protocol)?url.href:null;}
function visibleEntries(){const query=state.query.trim().toLocaleLowerCase();return state.entries.filter(entry=>(state.season==='all'||entry.season===state.season)&&(!query||`${entry.id} ${entry.name} ${entry.sekki} ${seasons[entry.season]}`.toLocaleLowerCase().includes(query)));}
function palette(entry,expanded=false){const wrapper=element('div',expanded?'palette':'swatches');for(const color of entry.palette||[]){if(!/^#[a-f0-9]{6}$/i.test(color.hex))continue;const swatch=element('span','swatch');swatch.style.backgroundColor=color.hex;swatch.title=`${color.role||''} ${color.hex}`;if(expanded){const row=element('div','palette-key');row.append(swatch,element('span','',`${color.role||'配色'} ${color.hex}`));wrapper.append(row);}else wrapper.append(swatch);}return wrapper;}
function artwork(entry,large=false){const container=element('div',large?'detail-art':'');const url=entry.status==='succeeded'?assetUrl(entry.image):null;if(url){const img=element('img');img.src=url;img.alt=entry.name;img.decoding='async';if(!large)img.loading='lazy';img.addEventListener('error',()=>{container.replaceChildren(element('div','empty-art error','画像を読み込めませんでした'));},{once:true});container.append(img);}else{const blank=element('div','empty-art');blank.append(element('span','number',entry.id.replace('kou-','')),element('span','',statuses[entry.status]));container.append(blank);}return container;}
function render(){const entries=visibleEntries();gallery.replaceChildren();for(const entry of entries){const card=element('article','card');card.dataset.id=entry.id;card.dataset.status=entry.status;const button=element('button','art-button');button.type='button';button.setAttribute('aria-label',`${entry.name}を拡大表示`);const art=artwork(entry);art.style.height='100%';button.append(art,element('span',`badge ${entry.status}`,statuses[entry.status]));button.addEventListener('click',()=>openEntry(entry.id));const meta=element('div','card-meta');const top=element('div','card-top');top.append(element('span','',`${seasons[entry.season]} / ${entry.sekki}`),element('span','',entry.id.replace('kou-','')));meta.append(top,element('h2','',entry.name),element('p','meaning',entry.meaning||entry.relation||''),element('p','color-reason',entry.colorReason||''),palette(entry));card.append(button,meta);gallery.append(card);}document.getElementById('result-count').textContent=`${entries.length}候を表示 / 全${state.entries.length}候`;notice.hidden=entries.length>0;notice.textContent='条件に合う候がありません。季節や検索語を変えてください。';if(dialog.open)renderDetail();}
function renderDetail(){const entry=state.entries.find(item=>item.id===state.selected);if(!entry){dialog.close();return;}const entries=visibleEntries();const index=entries.findIndex(item=>item.id===entry.id);document.getElementById('detail-kicker').textContent=`${seasons[entry.season]} / ${entry.sekki} / ${entry.id}`;const copy=element('div','detail-copy');copy.append(element('span',`badge ${entry.status}`,statuses[entry.status]));copy.firstChild.style.position='static';const title=element('h2','',entry.name);title.id='detail-title';copy.append(title,element('p','',entry.meaning||''));if(entry.relation&&entry.relation!==entry.meaning)copy.append(element('p','',entry.relation));if(entry.colorReason)copy.append(element('p','color-reason',entry.colorReason));copy.append(palette(entry,true));if(entry.status==='failed')copy.append(element('p','error',entry.error||'生成に失敗しました。'));const url=entry.status==='succeeded'?assetUrl(entry.original||entry.image):null;if(url){const link=element('a','download','元画像を開く ↗');link.href=url;link.target='_blank';link.rel='noopener';copy.append(link);}document.getElementById('detail').replaceChildren(artwork(entry,true),copy);document.getElementById('detail-position').textContent=index>=0?`${index+1} / ${entries.length}`:'';document.getElementById('previous').disabled=index<=0;document.getElementById('next').disabled=index<0||index>=entries.length-1;}
function openEntry(id){state.selected=id;renderDetail();dialog.showModal();}
function moveEntry(offset){const entries=visibleEntries();const index=entries.findIndex(entry=>entry.id===state.selected);if(entries[index+offset]){state.selected=entries[index+offset].id;renderDetail();}}
async function load(){clearTimeout(state.timer);try{const response=await fetch('poc-v3/gallery.json',{cache:'no-store'});if(!response.ok)throw new Error('一覧データを読み込めませんでした。');const manifest=await response.json();if(manifest.schemaVersion!==3||!Array.isArray(manifest.entries)||manifest.entries.some(entry=>!entry.id||!entry.name||!seasons[entry.season]||!statuses[entry.status]))throw new Error('図案一覧の形式を確認できませんでした。');const entries=manifest.entries;const counts={succeeded:0,pending:0,failed:0};for(const entry of entries)counts[entry.status]++;document.getElementById('summary').textContent=`生成済み ${counts.succeeded} / ${entries.length}候　生成待ち ${counts.pending}　失敗 ${counts.failed}`;document.getElementById('batch-note').textContent=counts.pending?'生成状況を15秒ごとに更新します。':'現在の生成結果を表示しています。';const revision=JSON.stringify(entries);if(revision!==state.revision){state.entries=entries;state.revision=revision;render();}if(counts.pending)state.timer=setTimeout(load,15000);}catch(error){document.getElementById('batch-note').textContent='15秒後に再読み込みします。';if(!state.entries.length){notice.hidden=false;notice.textContent=error.message;}else document.getElementById('batch-note').textContent='更新できませんでした。15秒後に再試行します。';state.timer=setTimeout(load,15000);}}
for(const button of document.querySelectorAll('[data-season]'))button.addEventListener('click',()=>{state.season=button.dataset.season;for(const other of document.querySelectorAll('[data-season]'))other.setAttribute('aria-pressed',String(other===button));render();});
document.getElementById('search').addEventListener('input',event=>{state.query=event.target.value;render();});
document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();}});
dialog.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'){event.preventDefault();moveEntry(-1);}if(event.key==='ArrowRight'){event.preventDefault();moveEntry(1);}});
document.getElementById('previous').addEventListener('click',()=>moveEntry(-1));document.getElementById('next').addEventListener('click',()=>moveEntry(1));
load();
</script>
</body>
</html>
