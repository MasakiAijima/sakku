<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>72候｜強い色の比較</title>
<style>
:root{color:#3e3a31;background:#f6f3ea;font-family:system-ui,-apple-system,'Hiragino Sans',sans-serif}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:48px 24px}nav{display:flex;gap:22px;font-size:13px}a{color:inherit;text-underline-offset:4px}h1{font-size:clamp(26px,4vw,40px);font-weight:550;letter-spacing:.04em;margin:34px 0 16px}.intro{line-height:1.9;color:#706b60;max-width:760px;font-size:14px}.count{font-size:13px;color:#777064;margin:30px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{border:1px solid #e1dccf;border-radius:16px;background:#fbf9f3;padding:22px}.top{display:flex;align-items:baseline;gap:12px}.id{font-size:11px;color:#888071;letter-spacing:.08em}h2{font-size:18px;font-weight:550;margin:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}figure{margin:0;min-width:0}figcaption{font-size:12px;color:#82796a;text-align:center;margin:6px 0}button.art{display:block;width:100%;border:0;background:#f3efe5;border-radius:10px;aspect-ratio:1;cursor:zoom-in;padding:8px}img{width:100%;height:100%;object-fit:contain}.placeholder{display:flex;align-items:center;justify-content:center;aspect-ratio:1;background:#f3efe5;border-radius:10px;color:#918779;font-size:12px}.accent{display:flex;align-items:center;gap:9px;margin-top:20px;font-size:12px;color:#756b5d}.swatch{width:18px;height:18px;border-radius:50%;border:1px solid #0001;flex:none}.target{font-size:12px;line-height:1.8;color:#918575;margin:9px 0 0}dialog{border:1px solid #ded7c9;background:#fbf9f3;border-radius:16px;width:min(1000px,95vw);max-height:94vh;padding:24px;color:inherit}dialog::backdrop{background:#302a23aa}dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px}dialog .pair{margin-top:20px}dialog img{max-height:65vh;aspect-ratio:1;background:#f3efe5;border-radius:10px}#close{border:1px solid #d6cdbd;background:transparent;padding:8px 14px;border-radius:20px;cursor:pointer}footer{margin-top:36px;font-size:12px;color:#938778;line-height:1.8}@media(max-width:650px){main{padding:26px 14px}.grid{grid-template-columns:1fr;gap:16px}.card{padding:18px}dialog{padding:16px}h2{font-size:16px}}
</style>
<main><nav><a href="color-abc.html">A / B / C の比較</a><a href="gallery.html">72候のギャラリー</a><a href="revision-review.html#filled-preview">72候の固定配置</a></nav><h1>強い色を、ひとつ。</h1><p class="intro">前回の10候と春の2候に、自然の色から少し離れた強い色を1色だけ加えた比較案です。現行版の構図と形を保ちながら、原画の鮮やかな色使いを試しています。</p><p class="count" id="count">比較画像を読み込んでいます。</p><section class="grid" id="grid"></section><footer>比較用の別バージョンです。現行の72候の画像はそのまま残しています。</footer></main>
<dialog id="detail"><header><h2 id="detailTitle"></h2><button id="close" type="button">閉じる</button></header><div class="pair" id="detailPair"></div></dialog>
<script>
const grid=document.querySelector('#grid'),count=document.querySelector('#count'),dialog=document.querySelector('#detail');let timer;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}
function urls(row){return{original:new URL('poc-v3/'+row.sourcePath,location.href).href,variant:new URL('color-study-10/'+(row.image||row.id+'/completed.png'),location.href).href}}
function figure(label,url,onClick){const f=el('figure');if(url){const im=el('img');im.src=url;im.alt=label;im.loading='lazy';if(onClick){const b=el('button','art');b.type='button';b.setAttribute('aria-label',label+'を拡大');b.onclick=onClick;b.append(im);f.append(b)}else f.append(im)}else f.append(el('div','placeholder','生成中'));f.append(el('figcaption','',label));return f}
function open(row,u){document.querySelector('#detailTitle').textContent=row.name;const pair=document.querySelector('#detailPair');pair.replaceChildren(figure('現行版',u.original),figure('強色版',row.status==='succeeded'||row.status==='complete'||row.status==='completed'?u.variant:null));dialog.showModal()}
document.querySelector('#close').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};
async function refresh(){try{const r=await fetch('color-study-10/manifest.json',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json(),rows=Array.isArray(data)?data:data.entries||data.items||[];let ready=0;grid.replaceChildren();for(const row of rows){const u=urls(row),done=['succeeded','complete','completed'].includes(row.status);if(done)ready++;const card=el('article','card'),top=el('div','top');top.append(el('span','id',row.id),el('h2','',row.name));card.append(top);const pair=el('div','pair');pair.append(figure('現行版',u.original,()=>open(row,u)),figure('強色版',done?u.variant:null,()=>open(row,u)));card.append(pair);const accent=el('div','accent'),sw=el('span','swatch');sw.style.backgroundColor=row.accentHex;accent.append(sw,el('span','',(row.accentName||'強色')+' '+(row.accentHex||'')));card.append(accent);grid.append(card)}count.textContent=ready+' / '+rows.length+' 候の比較画像';clearTimeout(timer);if(ready<rows.length)timer=setTimeout(refresh,15000)}catch{count.textContent='比較画像を準備しています。';timer=setTimeout(refresh,15000)}}refresh();
</script></html>
