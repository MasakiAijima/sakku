</style></head><body><main><nav><a href="cprime-fixed.html">C′の固定配置</a> · <a href="cprime-gallery.html">C′とCの比較</a></nav><h1>季節が育つ</h1><p>小さなきざしから、季節のかたちへ。訪れた候が、立春から順に芽吹きます。まだ訪れていない候はC′のまま残ります。</p><section class="controls" aria-label="アニメーションの操作"><div class="row"><label for="arrived">到来済みの候数</label><input id="arrived" type="range" min="0" max="72" value="50"><output id="count" for="arrived">50 / 72候</output></div><p id="current"></p><div class="row"><button id="replay" disabled>はじめから再生</button><button id="pause" disabled>一時停止</button><button id="settle" disabled>完成状態を見る</button><button id="seed" disabled>C′に戻す</button><label for="speed">速さ</label><select id="speed"><option value="1">標準</option><option value="2">ゆっくり</option></select></div></section><p id="status" role="status" aria-live="polite">画像を読み込んでいます。</p><div class="canvas"><svg id="growth72" viewBox="0 0 700 700" role="img" aria-label="七十二候が古い順に育つアニメーション" data-ready="false"></svg></div></main><script type="module" src="cprime-growth.js"></script></body></html>
