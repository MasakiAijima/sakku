<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>季節の色彩実験 · A / B / C</title><style>
:root{color:#302e26;background:#f7f3e9;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:36px 24px}a{color:inherit}h1{font-size:clamp(24px,4vw,38px);font-weight:500;margin:12px 0}p{line-height:1.8}.intro{max-width:800px;color:#696657}.eyebrow{letter-spacing:.15em;font-size:12px}nav,.legend{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}button{font:inherit;color:inherit;cursor:pointer}nav button,.close{border:1px solid #d3cebd;border-radius:30px;background:transparent;padding:9px 18px}nav button[aria-pressed=true]{background:#353b30;color:#fff;border-color:#353b30}.legend span{display:inline-flex;align-items:center;gap:8px;font-size:13px;margin-right:12px}.swatch{display:inline-block;width:12px;height:12px;flex:none;border-radius:50%;background:var(--color)}.summary{font-size:13px;color:#77715e}article{margin:26px 0 40px;border-top:1px solid #d9d2c0;padding-top:20px}h2{font-size:21px;font-weight:500;margin:0 0 8px}.metadata{display:flex;flex-wrap:wrap;align-items:center;gap:9px;font-size:13px;color:#716c5b;margin-bottom:18px}.comparisons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.art{display:block;width:100%;background:#f1ecdf;border:none;padding:12px;border-radius:5px;text-align:left}.art:focus-visible{outline:3px solid #155dd8}.art img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.label{display:block;font-size:13px;line-height:1.7;margin-top:10px}.label strong{font-size:17px;margin-right:6px}.placeholder{aspect-ratio:1;display:grid;place-items:center;font-size:13px;color:#817b69}.error{color:#963b27}dialog{width:min(1300px,96vw);max-width:none;max-height:94vh;background:#f7f3e9;color:inherit;border:none;border-radius:8px;padding:24px}dialog::backdrop{background:#25251fd9}.modal-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.modal-header h2{margin:0}.close{padding:7px 15px}dialog .art{cursor:default}footer{font-size:13px;color:#77715e;margin:32px 0}@media(max-width:600px){main{padding:24px 12px}.comparisons{gap:5px}.art{padding:5px}.label{font-size:11px;line-height:1.5}.label strong{display:block;font-size:14px;margin:0}h2{font-size:18px}.metadata{font-size:12px}dialog{padding:13px}.placeholder{font-size:11px}nav{gap:6px}nav button{padding:8px 13px}}
</style><main><a href="gallery.html">← A案のギャラリー</a> · <a href="c-gallery.html">C案72候</a> · <a href="c-fixed.html">C案の固定配置</a><p class="eyebrow">SEASONAL COLOR STUDY</p><h1>主役の色から、小さな差し色へ。</h1><p class="intro">A は自然の色を生かした現行版。B は主役の色面を強い色にした前回の実験。C は主役の色を保ち、第3色に季節ごとのアクセントを入れた今回の実験です。同じ構図で、色の効き方を見比べます。</p><p class="summary">前回10候 ＋ 春2候 · 画像を押すと A / B / C を拡大できます。</p><div class="legend" aria-label="C の季節別アクセントカラー"><span><i class="swatch" style="--color:#E73E73"></i>春 · 紅桃</span><span><i class="swatch" style="--color:#F24B20"></i>夏 · 朱</span><span><i class="swatch" style="--color:#F48708"></i>秋 · 橙</span><span><i class="swatch" style="--color:#155DD8"></i>冬 · 青</span></div><nav aria-label="季節で絞り込む"></nav><p id="status" class="summary" role="status">画像を読み込んでいます。</p><section id="cards" aria-label="A B C の比較"></section><footer>このページは色の比較用です。72候の現行版は A として残しています。</footer></main><dialog id="zoom"><div class="modal-header"><h2 id="zoom-title"></h2><button class="close" aria-label="拡大表示を閉じる">閉じる</button></div><div id="zoom-images" class="comparisons"></div></dialog><script>
const names={spring:'春',summer:'夏',autumn:'秋',winter:'冬'},labels=['自然配色','主役を強色','第3色を強色'];let entries=[],bEntries=new Map(),season='all',timer,activeId=null;const cards=document.querySelector('#cards'),status=document.querySelector('#status'),dialog=document.querySelector('#zoom');function element(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}for(const [value,label]of [['all','すべて'],...Object.entries(names)]){const button=element('button',label);button.type='button';button.setAttribute('aria-pressed',value==='all');button.onclick=()=>{season=value;document.querySelectorAll('nav button').forEach(n=>n.setAttribute('aria-pressed',n===button));render()};document.querySelector('nav').append(button)}
function panel(entry,index,modal=false){const b=bEntries.get(entry.id),record=index===1?b:entry,ready=index===0||record?.status==='succeeded',box=element(modal?'div':'button',undefined,'art');if(!modal){box.type='button';box.setAttribute('aria-label',`${entry.name}の A B C を拡大`);box.onclick=()=>open(entry)}if(ready){const img=element('img');img.alt=`${entry.name} · ${'ABC'[index]} ${labels[index]}`;img.loading=modal?'eager':'lazy';img.src=index===0?'poc-v3/'+entry.sourcePath:(index===1?'color-study-10/':'color-study-c72/')+entry.id+'/completed.png';if(index>0&&record.generationHash)img.src+='?v='+record.generationHash.slice(0,12);box.append(img)}else{box.append(element('div',record?.status==='failed'?'生成を確認中':'生成待ち','placeholder'))}const label=element('span',undefined,'label');label.append(element('strong','ABC'[index]),document.createTextNode(labels[index]));box.append(label);return box}
function open(entry){activeId=entry.id;document.querySelector('#zoom-title').textContent=entry.name;const images=document.querySelector('#zoom-images');images.replaceChildren(...[0,1,2].map(i=>panel(entry,i,true)));if(!dialog.open)dialog.showModal()}document.querySelector('.close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>activeId=null);dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close()}});
function render(){const filtered=entries.filter(e=>season==='all'||e.season===season);cards.replaceChildren();for(const entry of filtered){const card=element('article');card.append(element('h2',entry.name));const meta=element('div',undefined,'metadata');meta.append(element('span',names[entry.season]||entry.season));const swatch=element('i',undefined,'swatch');swatch.style.setProperty('--color',entry.accentHex);swatch.setAttribute('aria-hidden','true');meta.append(swatch,element('span',`C · ${entry.accentName} / ${entry.targetLabel}`));card.append(meta);const grid=element('div',undefined,'comparisons');grid.append(...[0,1,2].map(i=>panel(entry,i)));card.append(grid);cards.append(card)}const done=entries.filter(e=>e.status==='succeeded').length,failed=entries.filter(e=>e.status==='failed').length;status.textContent=`${filtered.length}候を表示 · C ${done} / ${entries.length}候生成済み`+(failed?` · ${failed}候を確認中`:'');if(activeId){const entry=entries.find(e=>e.id===activeId);if(entry)open(entry)}}
async function load(){try{const responses=await Promise.all([fetch('color-study-c72/manifest.json',{cache:'no-store'}),fetch('color-study-10/manifest.json',{cache:'no-store'})]);if(responses.some(r=>!r.ok))throw new Error('manifest');const[c,b]=await Promise.all(responses.map(r=>r.json()));bEntries=new Map(b.entries.map(e=>[e.id,e]));entries=c.entries.filter(e=>bEntries.has(e.id));render();clearTimeout(timer);if(entries.some(e=>e.status!=='succeeded')||b.entries.some(e=>e.status!=='succeeded'))timer=setTimeout(load,15000)}catch(error){status.textContent='比較画像を準備しています。しばらくすると自動で更新します。';timer=setTimeout(load,15000)}}load();
</script></html>
