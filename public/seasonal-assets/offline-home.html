<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f2e8"><title>季節の庭 · オフライン</title><style>

</style></head><body><main><nav><a href="/" data-i18n="home">接続してホームを開く</a> · <button id="language" type="button">English</button></nav><h1 data-i18n="title">季節の庭</h1><p data-i18n="intro">保存した七十二候の庭を表示しています。訪れた候は季節のかたちに、これからの候は小さなきざしに。投稿や個人データはこの画面には保存していません。</p><div class="tools"><label for="seasonal-year" data-i18n="year">立春からの一年</label><select id="seasonal-year" disabled aria-label="季節の年"></select><span id="seasonal-current"></span></div><p id="seasonal-status" role="status" aria-live="polite">保存した季節を読み込んでいます。</p><div class="garden"><svg id="seasonal-orbit" viewBox="0 0 700 700" role="group" aria-label="七十二候の季節の庭" data-ready="false"></svg></div><section id="seasonal-detail" aria-live="polite">モチーフを選ぶと候の名前と期間を確認できます。</section></main><script type="module" src="/seasonal-assets/offline-home.js"></script></body></html>
